name: tagpr
on:
  push:
    branches: ["main"]
permissions: read-all

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # NOTE: デフォルトの GITHUB_TOKEN が push したタグは他のワークフローを起動しない。
      # release.yml をタグ push で起動させるため PAT を使う。
      - uses: Songmu/tagpr@0c4eb5a3b0862693702acea436a7c68bd586530d # v1.21.2
        env:
          GITHUB_TOKEN: ${{ secrets.GHUB_DESK_TAGPR_TOKEN }}
